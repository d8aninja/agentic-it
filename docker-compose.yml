version: "3.9"

services:
  ollama:
    build:
      context: .
      dockerfile: docker/ollama.Dockerfile
    container_name: agentic-it-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: agentic-it-agent
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  ollama_data:
